planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: False
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D" # Changed from Navfn
      tolerance: 0.5                      # Tolerance to goal
      allow_unknown: true                 # Allow planning through unknown space
      use_final_approach_orientation: true # Robot will arrive at goal orientation
      max_iterations: 1000000             # Max search steps
      max_on_approach_iterations: 1000    # Refinement steps near goal
      minimum_turning_radius: 0.0         # Set to 0.0 for differential/omni robots
      lookup_table_size: 20.0             # Size of the cost lookup table
      cost_travel_multiplier: 2.0         # Penalty for moving through higher costs     
      

smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 1.0
    # 2026-10-07: was left "true" when every other use_sim_time in this file
    # was switched to false - nothing on this robot publishes /clock, so with
    # this set, behavior_server's node clock never advances at all. Recovery
    # behaviors (Spin, BackUp, ...) time themselves against that clock, so
    # one would start ("Running spin" in the log) and then hang forever,
    # never completing or timing out - confirmed live: a goal that failed to
    # plan triggered a Spin recovery that got permanently stuck exactly like
    # this, with zero further behavior_server log output and zero cmd_vel
    # traffic, requiring a nav2 restart to recover.
    use_sim_time: false
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

robot_state_publisher:
  ros__parameters:
    use_sim_time: False

waypoint_follower:
  ros__parameters:
    use_sim_time: False
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: False
    enable_stamped_cmd_vel: true
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.20, 0.0, 2.08]
    min_velocity: [-0.15, 0.0, -2.08]
    max_accel: [1.0, 0.0, 1.5]
    max_decel: [-1.0, 0.0, -1.5]
    odom_topic: "/odometry/filtered"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
