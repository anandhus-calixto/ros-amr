controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 20.0
    # CHANGED: was 0.001 / 0.5 / 0.001 — y-threshold corrected for diff drive
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001   # was 0.5 (wrong for differential drive)
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      # 2026-10-07: was 10.0 - too tight for a near-180 degree in-place turn.
      # SimpleProgressChecker measures XY position change, which barely moves
      # during in-place rotation, and a direct-motor test (bypassing ROS)
      # found the right wheel delivers ~20% less distance in reverse than
      # forward for the same command - a real, repeatable, wheel-specific
      # weakness (not a planner/speed issue - see FollowPath's rotate_to_*
      # comment below). A goal behind the robot needs a long, slow, mostly
      # rotational turn before any translation starts, and was very likely
      # hitting this time allowance and getting declared "stuck" before it
      # ever had a chance to finish turning.
      movement_time_allowance: 25.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25

    FollowPath:
      # ----- RotationShim wrapping DWB -----
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "dwb_core::DWBLocalPlanner"
      angular_dist_threshold: 0.785          # engage shim above ~45 deg
      # angular_disengage_threshold: 1.2     # UNCOMMENT if on Nav2 Iron or later (adds hysteresis)
      forward_sampling_distance: 1.0         # was 0.5 — longer lookahead = stable heading target
      # 2026-10-07: were 1.6 / 1.5 - lowered after a direct-motor test (bypassing
      # ROS, same ramp/hold profile as this controller) found the right wheel
      # only delivers ~80% of the left wheel's distance when spinning in
      # reverse for the same commanded velocity, for this robot's whole
      # lifetime so far (not new damage). A lower absolute speed/accel target
      # gives that wheel's closed-loop controller an easier, more trackable
      # setpoint, instead of commanding a fast turn that one wheel physically
      # can't keep up with - which read as "struggling" rather than a clean
      # failure. Revisit this gap directly (drive current/torque tuning on
      # that wheel's reverse direction) rather than raising these back up.
      # 2026-10-07 (later): raised from 1.0/1.0 to 1.3/1.3 and max_vel_theta
      # 0.6 -> 0.9 on request - turning was too slow in practice. Deliberately
      # kept under the 1.6/1.5 backed out above, so the weak wheel still has
      # margin. The reverse-direction gap itself is still unfixed; if turns
      # start reading as "struggling" again, this is the first thing to undo.
      rotate_to_heading_angular_vel: 1.3
      max_angular_accel: 1.3
      simulate_ahead_time: 1.0

      # ----- DWB primary controller -----
      debug_trajectory_details: True
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.15
      max_vel_y: 0.0
      max_vel_theta: 0.9
      min_speed_xy: 0.0
      max_speed_xy: 0.15
      min_speed_theta: 0.001  # linear capped at 0.15 m/s, angular at 0.9 rad/s                 # was 0.4 — that value broke stopped-detection
      acc_lim_x: 1.0
      acc_lim_y: 0.0
      acc_lim_theta: 1.3
      decel_lim_x: -1.0
      decel_lim_y: 0.0
      decel_lim_theta: -1.0
      vx_samples: 20
      vy_samples: 5
      vtheta_samples: 20
      sim_time: 1.2
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 1.0
      xy_goal_tolerance: 0.25
      trans_stopped_velocity: 0.05
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: False
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      footprint: "[[0.39, 0.24], [0.39, -0.24], [-0.39, -0.24], [-0.39, 0.24]]"
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 1.0
        inflation_radius: 0.2              # was 0.5 — aligned with global for consistency
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan_filtered
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: False
      footprint: "[[0.39, 0.24], [0.39, -0.24], [-0.39, -0.24], [-0.39, 0.24]]"
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan_filtered
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 1.0
        inflation_radius: 0.2               # was 0.2 — must be >= inscribed radius (0.225)
      always_send_full_costmap: True

map_server:
  ros__parameters:
    use_sim_time: False
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

