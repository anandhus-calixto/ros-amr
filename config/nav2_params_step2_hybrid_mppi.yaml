# =============================================================================
# STEP 2 - planner and controller switched for a large rectangular robot.
# Try this only AFTER nav2_params_step1.yaml drives well.
#
# Same as step 1, plus:
#   A. planner_server:    SmacPlanner2D            -> SmacPlannerHybrid (Reeds-Shepp)
#   B. controller_server: RotationShim + DWB       -> MPPI
#
# Everything else (amcl, bt_navigator, costmaps, behaviors, smoother) is
# identical to step 1.
#
# THIS FILE IS A STARTING POINT, NOT A TUNED RESULT. The MPPI and Hybrid-A*
# values are scaled for a 0.15 m/s robot but have not been run on this robot.
# First runs: open floor, low stakes, hand on the e-stop.
#
# Before launching:
#   ros2 pkg list | grep mppi
# If nothing prints:
#   sudo apt install ros-$ROS_DISTRO-nav2-mppi-controller
#
# The robot is now ALLOWED TO REVERSE (vx_min: -0.10). Collision checking
# while reversing only sees what /scan_filtered sees behind the robot.
# =============================================================================

amcl:
  ros__parameters:
    use_sim_time: False
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_link"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"  # OmniMotionModel
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: /scan_filtered

bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/filtered
    #odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_battery_charging_condition_bt_node

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: False

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: False

controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 20.0
    # 2026-10-08: ADDED - controller_server defaults to "odom" otherwise.
    odom_topic: /odometry/filtered
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 25.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25

    # 2026-10-08: MPPI replaces RotationShim + DWB.
    # MPPI checks the real rectangular footprint while driving, follows
    # forward and reverse path segments, and can rotate in place by itself,
    # so the rotation shim is no longer needed.
    # Parameters marked (newer builds) are ignored by older Nav2 versions.
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"

      # --- horizon: 70 steps * 0.05 s = 3.5 s, about 0.5 m at 0.15 m/s ---
      # 2026-10-08: 70 -> 40 (horizon 3.5 s -> 2.0 s = 0.8 m at 0.40 m/s).
      # Sized for the i.MX8MP's 4x Cortex-A53: DWB at only 288 trajectories
      # per cycle was already missing its 20 Hz deadline ~38x per goal.
      time_steps: 40
      model_dt: 0.05              # keep equal to 1 / controller_frequency
      # 2026-10-08: 2000 -> 800 (see time_steps). Raise only if the controller
      # log shows no "missed its desired rate" warnings during goals.
      batch_size: 800
      iteration_count: 1
      prune_distance: 1.0         # must stay longer than the horizon distance
      transform_tolerance: 1.0
      temperature: 0.3
      gamma: 0.015
      motion_model: "DiffDrive"
      visualize: false            # true shows sampled trajectories in RViz (costs CPU)
      reset_period: 1.0
      regenerate_noises: false

      # --- velocity limits (same caps as the old DWB setup) ---
      # 2026-10-08: speeds matched to nav2_params_step1.yaml (max_vel_x 0.40,
      # max_vel_theta 0.8, acc_lim_x 1.0, acc_lim_theta 0.8, forward only).
      vx_max: 0.40
      # 2026-10-08: -0.10 -> 0.0, forward only like step1. Reversing is also
      # the riskiest direction here: the 25% body filter leaves ~10 cm
      # behind the robot unseen, so only the bumper covers it.
      vx_min: 0.0
      vy_max: 0.0
      wz_max: 0.8
      # how widely MPPI explores around its current plan
      vx_std: 0.08
      vy_std: 0.0
      wz_std: 0.3
      # acceleration limits (newer builds); velocity_smoother enforces them anyway
      ax_max: 1.0
      ax_min: -1.0
      az_max: 0.8                 # 2026-10-08: 1.3 -> 0.8, = step1 acc_lim_theta

      # Stop at forward/reverse switch points in the plan instead of cutting
      # across them (newer builds).
      enforce_path_inversion: false   # 2026-10-08: no reverse segments with DUBIN
      inversion_xy_tolerance: 0.2
      inversion_yaw_tolerance: 0.4

      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3

      critics: ["ConstraintCritic", "ObstaclesCritic", "GoalCritic", "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic"]

      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0

      ObstaclesCritic:
        enabled: true
        cost_power: 1
        repulsion_weight: 1.5
        critical_weight: 20.0
        consider_footprint: true         # use the rectangle, not a circle
        collision_cost: 10000.0
        collision_margin_distance: 0.1
        near_goal_distance: 0.5
        # Only read by older builds; newer ones take these from the local
        # costmap's inflation_layer. Keep in sync with it.
        inflation_radius: 0.6
        cost_scaling_factor: 2.5

      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.6       # about one horizon length from the goal

      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5       # must stay larger than xy_goal_tolerance

      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 3          # default 20 assumes a faster robot / longer horizon
        use_path_orientations: true      # (newer builds) reverse only where the plan says so

      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 3
        threshold_to_consider: 0.6

      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 3
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 2                          # follow the plan's own forward/reverse headings

      PreferForwardCritic:
        enabled: true
        cost_power: 1
        # Default is 5.0. Lowered so the robot will actually take a reverse
        # segment when the plan needs one. Raise it if the robot reverses
        # when it should not.
        cost_weight: 2.0
        threshold_to_consider: 0.5

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: False
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      footprint: "[[0.39, 0.24], [0.39, -0.24], [-0.39, -0.24], [-0.39, 0.24]]"
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # 2026-10-08: were 1.0 / 0.2 - see step 1. MPPI's obstacle critic
        # relies on this gradient reaching past the robot's corner reach.
        cost_scaling_factor: 2.5
        inflation_radius: 0.6
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan_filtered
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: False
      footprint: "[[0.39, 0.24], [0.39, -0.24], [-0.39, -0.24], [-0.39, 0.24]]"
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan_filtered
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # 2026-10-08: were 1.0 / 0.2 - see step 1. Hybrid-A* needs the
        # inflation radius to cover the robot's corner reach (~0.46 m).
        cost_scaling_factor: 2.5
        inflation_radius: 0.6
      always_send_full_costmap: True

map_server:
  ros__parameters:
    use_sim_time: False
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

# 2026-10-08: SmacPlannerHybrid replaces SmacPlanner2D.
# It plans with the robot's heading and real footprint, so it will not route
# through places the rectangle cannot fit or turn in, and with REEDS_SHEPP it
# can plan reverse segments (for example backing out of a tight pocket).
# Note: it refuses to plan if the robot's footprint already overlaps an
# obstacle in the global costmap ("start pose in collision").
planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0       # was 20.0; Hybrid-A* is heavier than 2D
    use_sim_time: False
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      downsample_costmap: false
      downsampling_factor: 1
      tolerance: 0.25
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 5.0
      # 2026-10-08: REEDS_SHEPP -> DUBIN (forward only), to match MPPI vx_min 0.0.
      motion_model_for_search: "DUBIN"
      angle_quantization_bins: 72              # 5 degree heading steps
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      # Tightest curve used in plans. Small because a diff-drive can turn
      # sharply; raise toward 0.4 if paths look too twitchy.
      minimum_turning_radius: 0.25
      reverse_penalty: 2.0                     # >1 prefers forward; reverse only when worth it
      change_penalty: 0.0
      non_straight_penalty: 1.2
      cost_penalty: 2.0
      retrospective_penalty: 0.015
      lookup_table_size: 20.0
      cache_obstacle_heuristic: false
      smooth_path: True
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true
        refinement_num: 2

smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 1.0
    # 2026-10-07: must stay false - nothing on this robot publishes /clock.
    use_sim_time: false
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

robot_state_publisher:
  ros__parameters:
    use_sim_time: False

waypoint_follower:
  ros__parameters:
    use_sim_time: False
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: False
    enable_stamped_cmd_vel: true
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.20, 0.0, 2.08]
    min_velocity: [-0.15, 0.0, -2.08]
    # 2026-10-08: angular was 1.5 / -1.5 - see step 1. The one place that
    # ramps angular velocity for every source.
    max_accel: [1.0, 0.0, 1.3]
    max_decel: [-1.0, 0.0, -1.3]
    odom_topic: "/odometry/filtered"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
