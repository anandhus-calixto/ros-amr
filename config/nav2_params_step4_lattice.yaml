# =============================================================================
# STEP 1 - same planner/controller as before (Smac 2D + RotationShim + DWB).
# Only the low-risk fixes. Every change is tagged "2026-10-08 step1".
#
#   1. controller_server.odom_topic           -> /odometry/filtered
#   2. FollowPath shim ramp                   -> closed_loop: false, accel 10.0
#   3. FollowPath.rotate_to_heading_angular_vel 1.3 -> 0.8
#   4. FollowPath.forward_sampling_distance   1.0 -> 0.5
#   5. inflation (local + global)             0.2 / 1.0 -> 0.6 / 2.5
#   6. velocity_smoother angular accel/decel  1.5 -> 1.3
#
# Rebased on config/nav2_params.yaml as of 2026-10-08, so it keeps the drive
# calibration done that day (wheel_separation 0.35 -> 0.384 in
# diffbot_controllers.yaml, which made commanded rotation land within ~6% of
# actual instead of ~21%).
# =============================================================================

